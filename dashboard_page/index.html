<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>I.G.O.R. Console</title>
<link rel="icon" href="/dashboard/npl.jpg">
<link rel="stylesheet" href="/dashboard/app.css">
</head>
<body>
<header class="top">
  <div class="identity">
    <div class="portrait" id="portrait"><img src="/dashboard/igor.jpg" alt="I.G.O.R." width="160" height="160"></div>
    <div class="nameplate">
      <p class="eyebrow">NeoPrimLabs <span>//</span> System console</p>
      <h1>I<span>.</span>G<span>.</span>O<span>.</span>R<span>.</span></h1>
      <p id="summary" class="status">Establishing link</p>
    </div>
  </div>
  <div class="clock"><span id="clock">--:--</span><span id="date"></span></div>
</header>

<div id="banner" class="banner" hidden></div>

<section class="gauges" id="gauges" aria-label="Vital signs"></section>

<main>
  <section class="panel"><h2><b>01</b> Vitals</h2><dl id="health"></dl></section>
  <section class="panel"><h2><b>02</b> Scheduled messages</h2><ul id="scheduled"></ul><h2 class="next"><b>03</b> Task board</h2><ul id="board"></ul></section>
  <section class="panel wide"><h2><b>04</b> Token flow, last 24 hours</h2><div id="tokens"></div></section>
  <section class="panel"><h2><b>05</b> Jobs</h2><ul id="jobs"></ul></section>
  <section class="panel"><h2><b>06</b> Plugins and background</h2><ul id="plugins"></ul><ul id="background"></ul><h2 class="next"><b>07</b> Error log</h2><ul id="errors" class="log"></ul></section>
</main>

<footer>
  <img src="/dashboard/npl.jpg" alt="NeoPrimLabs" width="40" height="40">
  <span>NeoPrimLabs <b>/</b> I.G.O.R. console</span>
  <span id="footer" class="stamp"></span>
</footer>
<script src="/dashboard/app.js"></script>
</body>
</html>
